# Heap for the one gradle daemon a build uses. Kotlin compiles in-process so no second daemon is
# spawned per worktree; several worktrees build on this 16 GB Mac, throttled by tools/gw.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=900000
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
